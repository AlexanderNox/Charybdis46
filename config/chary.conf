# Включить экспериментальные BLE соединения
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Настройки BLE периферии (интервалы, задержки и буферы)
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Отключить USB-логирование
CONFIG_ZMK_USB_LOGGING=n

# Интервал отчёта о заряде батареи в секундах
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Временные параметры сна (отключено из-за проблем с пробуждением экрана)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000     # Засыпание через 1 час бездействия (в миллисекундах)
# CONFIG_ZMK_IDLE_TIMEOUT=15000             # Вход в режим простоя через 15 секунд

# Настройки подавления дребезга клавиш (в миллисекундах)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Увеличение мощности BLE сигнала (решает проблемы связи между половинками клавиатуры)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Переименование клавиатуры
CONFIG_ZMK_KEYBOARD_NAME="Chary46"

# Настройки ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ДОБАВЛЕНО: Поддержка Unicode-ввода
CONFIG_ZMK_UNICODE=y
