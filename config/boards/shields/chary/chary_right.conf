CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT_PMW3610=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Allow the dongle to replace a stale split bond after re-pairing.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# One-shot recovery build: clear stale split bonds when this image boots.
CONFIG_ZMK_SETTINGS_RESET_ON_START=y
