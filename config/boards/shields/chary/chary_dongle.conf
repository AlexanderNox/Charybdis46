# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Chary46 Dongle"

# Split Central Role (Dongle)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT=y

# Peripheral count (Left + Right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Connection settings
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# ZMK Studio Support
CONFIG_ZMK_STUDIO=y

# Signal Strength
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Mouse/Trackball settings
CONFIG_ZMK_MOUSE=y

# Драйвер для виртуальной матрицы донгла
CONFIG_ZMK_KSCAN_MOCK=y
