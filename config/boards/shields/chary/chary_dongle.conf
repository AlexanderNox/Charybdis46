# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Chary46 Dongle"

# Split Central Role (Dongle)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT=y

# Peripheral count (Left + Right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Connection settings
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
# Process every connection event for minimum key latency. The ZMK default of
# 30 may defer an idle peripheral for up to roughly 230 ms.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
# Legacy Just Works pairing no longer needs the former 16-second ECDH
# workaround. Detect an actually lost peripheral link within six seconds.
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600

# ZMK Studio Support
CONFIG_ZMK_STUDIO=n
# CONFIG_ZMK_STUDIO_RPC_USB_UART=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# Signal Strength
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Mouse/Trackball settings
CONFIG_ZMK_MOUSE=y
